<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FX Full Page Screenshot</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="editor.css">
  <script type="module" src="editor.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="meta">
      <div id="title" class="title" data-i18n="loading"></div>
      <a id="source" class="source" target="_blank" rel="noopener"></a>
    </div>

    <div class="group" role="group" data-i18n-aria-label="toolsGroup">
      <button class="tool active" data-tool="crop" data-i18n="toolCrop" data-i18n-title="toolCropTitle"></button>
      <button class="tool" data-tool="box" data-i18n="toolBox" data-i18n-title="toolBoxTitle"></button>
      <button class="tool" data-tool="arrow" data-i18n="toolArrow" data-i18n-title="toolArrowTitle"></button>
      <button class="tool" data-tool="text" data-i18n="toolText" data-i18n-title="toolTextTitle"></button>
      <button class="tool" data-tool="pixelate" data-i18n="toolPixelate" data-i18n-title="toolPixelateTitle"></button>
      <input id="color" type="color" value="#ef4444" data-i18n-title="colorTitle">
      <select id="size" data-i18n-title="sizeTitle">
        <option value="0.6">S</option>
        <option value="1" selected>M</option>
        <option value="1.7">L</option>
      </select>
    </div>

    <div class="group">
      <button id="undo" data-i18n="undo" data-i18n-title="undoTitle" disabled></button>
      <button id="reset" data-i18n="reset" data-i18n-title="resetTitle"></button>
      <button id="zoom" data-i18n="zoomActual" data-i18n-title="zoomTitle"></button>
    </div>

    <div class="group">
      <label class="check" data-i18n-title="stampTitle"><input id="stamp" type="checkbox"> <span data-i18n="stampLabel"></span></label>
      <button id="copy" data-i18n="copy" data-i18n-title="copyTitle"></button>
      <button id="dl-png" class="primary" data-i18n-title="pngTitle">PNG</button>
      <button id="dl-jpg" class="primary" data-i18n-title="jpgTitle">JPG</button>
      <button id="dl-pdf" class="primary" data-i18n-title="pdfTitle">PDF</button>
    </div>
  </header>

  <nav id="parts" class="parts" hidden></nav>
  <div id="notice" class="notice" hidden></div>

  <main id="stage" class="stage">
    <div id="wrap" class="wrap">
      <svg id="overlay" class="overlay" aria-hidden="true" preserveAspectRatio="none"><g id="arrow-preview" style="display: none"><line></line><polygon></polygon></g></svg>
      <input id="text-input" class="text-input" type="text" hidden autocomplete="off" spellcheck="false">
      <div id="sel" class="sel" hidden>
        <span id="sel-size" class="sel-size"></span>
      </div>
      <div id="crop-actions" class="crop-actions" hidden>
        <button id="crop-apply" class="primary" data-i18n="cropApply"></button>
        <button id="crop-cancel" data-i18n-title="cropCancel">✕</button>
      </div>
    </div>
  </main>

  <div id="review" class="review" role="status" hidden>
    <span data-i18n="reviewAsk"></span>
    <a id="review-leave" class="button primary" target="_blank" rel="noopener" data-i18n="reviewLeave"></a>
    <button id="review-dismiss" data-i18n="reviewNoThanks"></button>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
